name: Update metal prices

on:
  schedule:
    - cron: "30 23 * * 1-5" # weekdays after the COMEX close
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python metals_prices.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add prices
          git diff --cached --quiet || git commit -m "Update prices $(date -u +%F)"
          git push
